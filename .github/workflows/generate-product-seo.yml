name: Generate VidaActiva product SEO pages
on:
  push:
    branches: [main]
    paths:
      - 'products.json'
      - 'scripts/generate-product-pages.mjs'
      - 'img/productos/**'
      - '.github/workflows/generate-product-seo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vidaactiva-product-seo
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate static product pages and sitemap
        run: node scripts/generate-product-pages.mjs
      - name: Commit generated SEO files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add producto sitemap.xml
          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate product SEO pages [skip ci]"
          git push origin main
