name: Supabase keepalive monitor
on:
  schedule:
    - cron: '15 7,15,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check public VidaActiva catalog endpoint
        env:
          SUPABASE_URL: https://kyuexpenylndneekcsaj.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_aGi8VYxdOSje8wBNjHf2UQ_pC9m1DO9
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/products?select=id&limit=1"
          echo "Supabase public catalog endpoint responded successfully."
